[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fgtools"
version = "0.1.0"
description = "Source tools shared by the Font.Garden font projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eli Heuer" }]
requires-python = ">=3.13"
dependencies = [
    "diffenator3",
    "fontspectorapi",
    "fonttools",
    "gftools",
    "numpy",
    "Pillow",
    "PyYAML",
    "uharfbuzz",
]

[project.scripts]
fgtools = "fgtools.cli:main"

[tool.setuptools]
packages = ["fgtools", "fgtools.proof_web"]

[tool.setuptools.package-data]
"fgtools" = ["accented_letters.toml", "harnesses.toml", "reference_fonts.toml", "media_canvases.toml", "media_words.toml", "media_plotter.rs", "media_formats/*.toml", "media_formats/*/*.py"]
"fgtools.proof_web" = ["samples.toml", "render_detail.rs", "app/*"]
