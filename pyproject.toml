[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fontgarden-tools"
version = "0.1.0"
description = "Source tools shared by the Font.Garden font projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eli Heuer" }]
requires-python = ">=3.13"
dependencies = [
    "diffenator3",
    "fonttools",
    "numpy",
    "Pillow",
    "PyYAML",
]

[project.scripts]
fgtools = "fontgarden.cli:main"

[tool.setuptools]
packages = ["fontgarden", "fontgarden.proof_web"]

[tool.setuptools.package-data]
"fontgarden.proof_web" = ["samples.toml", "render_detail.rs", "app/*"]
