[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fontgarden-tools"
version = "0.1.0"
description = "Source tools shared by the Font.Garden font projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eli Heuer" }]
requires-python = ">=3.13"
dependencies = [
    "fonttools",
    "numpy",
    "Pillow",
    "PyYAML",
]

[project.scripts]
fontgarden = "fontgarden.cli:main"

[tool.setuptools]
packages = ["fontgarden"]
