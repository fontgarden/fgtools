# The canvases of the marketing media, for `fgtools media`.
#
# One canvas is one size of picture or video that the platforms accept. The
# safe area is the part that no interface element or grid crop hides: `safe`
# gives the distance from each edge, in pixels. The platforms change these
# values. Checked in November 2026 against the developer and help pages of
# Instagram, TikTok, LinkedIn, X and Mastodon. No platform of this list
# publishes its safe area: the values are from current guides. A safe area
# here is valid on every platform that uses the canvas.

[canvas.portrait]
width = 1080
height = 1350
safe = { top = 0, right = 40, bottom = 0, left = 40 }
use = "Feed image and carousel on Instagram, LinkedIn, X and Mastodon; the page of a LinkedIn document. The Instagram grid shows 3:4 and cuts the sides."

[canvas.vertical]
width = 1080
height = 1920
safe = { top = 270, right = 195, bottom = 672, left = 120 }
lattice = true      # the modules are drawn on the whole canvas: the text area is a small part of it
use = "Instagram Reel and Story, and TikTok. The interface covers the top, the bottom and the right side."

[canvas.landscape]
width = 1920
height = 1080
safe = { top = 54, right = 96, bottom = 54, left = 96 }
use = "Video and wide image on X, LinkedIn and Mastodon."

[canvas.square]
width = 1080
height = 1080
safe = { top = 54, right = 54, bottom = 54, left = 54 }
use = "A square image, for a page or a profile that needs one."

[canvas.card]
width = 1200
height = 630
safe = { top = 15, right = 0, bottom = 15, left = 0 }
use = "The link preview (Open Graph image and X card). X cuts it to 2:1."

[canvas.page]
width = 1684
height = 1190
scale = 0.5
theme = "light"
safe = { top = 0, right = 0, bottom = 0, left = 0 }
use = "The page of the print specimen: A4 landscape, written as a PDF at half size, so that 1 pixel is half a point."

# One video preset for every platform. Each platform encodes the file again.
[video]
frames_per_second = 30
