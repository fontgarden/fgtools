# The default formats of `fgtools media`, and the canvases of each. A project
# gets all of them without a file of its own. A table with the name of a
# format in documentation/media/formats.toml of a project changes the
# canvases and adds the caption and the alternative text. A script with the
# same name in the project replaces the default script.

[words]
canvases = ["portrait", "square", "landscape", "vertical"]

[weights]
canvases = ["portrait", "square"]

[text]
canvases = ["portrait", "square"]

[scripts]
canvases = ["portrait", "square"]

[release]
canvases = ["portrait", "square", "landscape", "vertical"]

[link-card]
canvases = ["card"]

[glyph]
canvases = ["portrait", "square"]

[characters]
canvases = ["portrait"]

[weight-axis]
canvases = ["vertical", "portrait", "landscape"]
