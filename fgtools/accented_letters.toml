# The sets of accented letters that `fgtools build-accented-letters` builds.
#
# A set is a string of characters. Each character is a Latin letter with a
# mark, and Unicode gives its parts (the canonical decomposition).
# Add a set here, or give the characters with --characters.

[sets]
